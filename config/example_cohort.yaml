# Example cohort configuration (reference only).
#
# The pipeline does NOT read this file; it is driven entirely by command-line
# options. The file exists so the settings that vary between cohorts can be written
# down in one readable place, reviewed, and turned into a command.
#
# See docs/STATUS.md for the state of configuration-file support.

dataset: biogen                # --dataset {biogen, snit}

paths:
  project_root: /path/to/NeuroMelAnchor           # --project_root, a checkout of this repository
  design_dir:   /path/to/bids_root                # --design_dir, contains sub-*
  output_root:  /path/to/NeuroMelAnchor/outputs   # --output_root, inside project_root for V4
  work_dir:     /path/to/work                     # --work_dir, large and disposable
  manual_dir:   null                              # --manual_dir, optional per-subject SN masks

input:
  nm_input: combo              # --nm_input {combo, echo}
  nm_echo: 3                   # --nm_echo, used only when nm_input is echo
  nm_image_strategy: mean      # --nm_image_strategy {mean, first}
  nm_image_n: null             # --nm_image_n, average only the first N acquisitions

execution:
  n_procs: 10                  # --n_procs
  stage: all                   # --stage {1, segment, 2, group_qc, all}
  smooth: 0                    # --smooth, FWHM in mm; 0 disables
  test: false                  # --test, first subject only
  skip_group_qc: false         # --skip_group_qc
  hires: true                  # --hires, required for the V4 drawing template

template:
  drawing_template: v4         # --drawing_template {v4, naive}
  rebuild_template: false      # --rebuild_template, refuses to run while a tracing exists

nm_mask:
  search_dilation_mm: 0.0      # --search_dilation_mm, grow the propagated SN tracing (the poster used 0.5)
  seed_cnr_floor: 0.05         # --seed_cnr_floor
  seed_cnr_percentile: 55      # --seed_cnr_percentile
  seed_min_cluster_voxels: 15  # --seed_min_cluster_voxels
  seed_components_to_keep: 2   # --seed_components_to_keep
  seed_cnr_fwhm: 1.0           # --seed_cnr_fwhm
  seed_slice_fill: false       # --seed_slice_fill
  seed_image: n4               # --seed_image {n4, raw}
  trace_route: template        # --trace_route {template, t1}
  skip_t1_outputs: false       # --skip_t1_outputs
  t1_interp: linear            # --t1_interp {linear, nearest}
  t1_seed_res: null            # --t1_seed_res, mm; null keeps the T1 grid
  skip_core_rim_nm: false      # --skip_core_rim_nm

evaluation:
  prob_atlas_mni: null         # --prob_atlas_mni, defaults to the CIT168 probabilistic SNc
  prob_atlas_threshold: 0.25   # --prob_atlas_threshold
  skip_prob_atlas: false       # --skip_prob_atlas
  nms_atlas_mni: null          # --nms_atlas_mni, defaults to the NMS probabilistic SNc
  nms_atlas_threshold: 0.25    # --nms_atlas_threshold
  skip_nms_atlas: false        # --skip_nms_atlas

# The core-rim constants are NOT command-line options. They are module-level in
# neuromelanchor_pipeline.py and echoed into the run log. Listed for reference.
core_rim_constants_readonly:
  core_rim_erosion_mm: 0.5
  core_rim_core_cnr_threshold: 0.05
  core_rim_rim_cnr_threshold: 0.10
  core_rim_min_cluster_voxels: 25
  core_rim_components_to_keep: 2

# The command these settings describe:
#
#   python workflow/scripts/neuromelanchor_pipeline.py \
#     --project_root /path/to/NeuroMelAnchor \
#     --design_dir   /path/to/bids_root \
#     --output_root  /path/to/NeuroMelAnchor/outputs \
#     --work_dir     /path/to/work \
#     --dataset biogen --nm_input combo --nm_image_strategy mean \
#     --stage all --n_procs 10 --smooth 0 --hires \
#     --drawing_template v4 --search_dilation_mm 0 \
#     --prob_atlas_threshold 0.25 --nms_atlas_threshold 0.25
